<svg xmlns="http://www.w3.org/2000/svg" viewBox="36 30 440 450" role="img" aria-label="Atlas">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46639A"/>
      <stop offset="1" stop-color="#15213D"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22355C"/>
      <stop offset="0.5" stop-color="#9DB3D8"/>
      <stop offset="1" stop-color="#22355C"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B7C7E3"/>
      <stop offset="1" stop-color="#3A4F78"/>
    </linearGradient>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <path d="M52 300 A204 58 0 0 0 460 300" transform="rotate(-12 256 300)" fill="none" stroke="#000" stroke-width="30"/>
    </mask>
  </defs>
  <!-- tall arch behind: the path a person travels -->
  <ellipse cx="262" cy="248" rx="96" ry="200" transform="rotate(12 262 248)" fill="none" stroke="url(#arch)" stroke-width="10" opacity="0.75"/>
  <!-- back half of the orbit -->
  <path d="M52 300 A204 58 0 0 1 460 300" transform="rotate(-12 256 300)" fill="none" stroke="url(#orbit)" stroke-width="16" stroke-linecap="round"/>
  <!-- the person -->
  <g mask="url(#cut)">
    <circle cx="256" cy="158" r="44" fill="url(#ink)"/>
    <path d="M164 440 L256 256 L348 440" fill="none" stroke="url(#ink)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- front half of the orbit, passing in front of the person -->
  <path d="M52 300 A204 58 0 0 0 460 300" transform="rotate(-12 256 300)" fill="none" stroke="url(#orbit)" stroke-width="16" stroke-linecap="round"/>
</svg>
